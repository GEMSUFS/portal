<html lang="pt-BR">
<head>

  <!-- Prévia ao compartilhar no WhatsApp e redes. Depois de publicar, troque
       "assets/img/og-gems.png" pelo endereço completo (veja o README). -->

  <meta property="og:locale" content="pt_BR">
  <meta property="og:site_name" content="GEMS · Portal de notícias">
  <meta property="og:title" content="GEMS · Portal de notícias">

  <meta property="og:image" content="assets/img/og-gems.png">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/img/favicon-192.png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&family=Newsreader:ital,opsz,wght@0,6..72,400..800;1,6..72,400..600&display=swap">
  <link rel="stylesheet" href="assets/css/portal.css">

  <script>
    // tema escolhido antes (evita piscar claro->escuro) e erro de digitação no conteudo.js
    try { var t = localStorage.getItem("gems-tema"); if (t === "claro" || t === "escuro") document.documentElement.setAttribute("data-tema", t); } catch (e) {}
    window.addEventListener("error", function (e) {
      var alvo = e.target && e.target.src;
      if (alvo && /conteudo\.js/.test(alvo)) window.__erroConteudo = { faltando: true };
      else if (e.filename && /conteudo\.js/.test(e.filename)) window.__erroConteudo = { linha: e.lineno, msg: e.message };
    }, true);
  </script>
</head>
<body data-pagina="inicio">
  <div id="topo"></div>
  <main id="conteudo" tabindex="-1">
    <noscript><div class="container"><p class="aviso-erro">Ative o JavaScript no navegador para ver as notícias do GEMS.</p></div></noscript>
  </main>
  <div id="fim"></div>

  <script src="conteudo.js"></script>
  <script src="assets/js/portal.js"></script>
</body>
</html>
